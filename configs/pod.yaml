apiVersion: v1
kind: Pod
metadata:
  name: example-experiment-pod
  namespace: example
  labels:
    app: vllm-admission-lab
    experiment: rtx5090-20261118-v1
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  nodeSelector:
    kubernetes.io/hostname: example-gpu-node
  containers:
    - name: experiment
      image: docker.m.daocloud.io/pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
      imagePullPolicy: IfNotPresent
      workingDir: /workspace/user/vllm-admission-lab/experiments/rtx5090-20261118-v1
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          { apt-get -o Dir::Etc::sourceparts=- update;
            apt-get -y --no-install-recommends install build-essential util-linux;
            dpkg-query -W gcc g++ libc6-dev;
          } > artifacts/setup/toolchain_install.log 2>&1
          touch /tmp/toolchain-ready
          exec setpriv --reuid=1001 --regid=1001 --clear-groups sleep infinity
      readinessProbe:
        exec:
          command: ["/bin/sh", "-c", "test -f /tmp/toolchain-ready"]
        initialDelaySeconds: 3
        periodSeconds: 5
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
      env:
        - name: HOME
          value: /workspace/user/vllm-admission-lab/experiments/rtx5090-20261118-v1
        - name: XDG_CACHE_HOME
          value: /workspace/user/vllm-admission-lab/experiments/rtx5090-20261118-v1/.cache
        - name: OMP_NUM_THREADS
          value: "4"
        - name: OPENBLAS_NUM_THREADS
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
      resources:
        requests:
          cpu: "4"
          memory: 20Gi
          ephemeral-storage: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 48Gi
          ephemeral-storage: 20Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: project
          mountPath: /workspace/user/vllm-admission-lab
        - name: managed-python
          mountPath: /workspace/user/.local/share/uv/python
          readOnly: true
        - name: model
          mountPath: /models/Qwen2.5-7B-Instruct
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
  volumes:
    - name: project
      hostPath:
        path: /workspace/user/vllm-admission-lab
        type: Directory
    - name: managed-python
      hostPath:
        path: /workspace/user/.local/share/uv/python
        type: Directory
    - name: model
      hostPath:
        path: /data/example/models/Qwen2.5-7B-Instruct
        type: Directory
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
