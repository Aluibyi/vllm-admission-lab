[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-admission-lab"
version = "0.1.0"
description = "Reproducible work-aware admission scheduling in front of vLLM"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

